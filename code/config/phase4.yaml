plant:
  tire_model: tanh
  friction_coefficient: 0.9
  gravity_mps2: 9.81
  sample_time_s: 0.01
  validation_speeds_mps: [12.0, 20.0, 28.0]

experiment_4a:
  duration_s: 8.0
  steering_amplitudes_deg:
    small: 0.1
    moderate: 2.0
    strong: 6.0
  integration_steps_s: [0.04, 0.02, 0.01, 0.005, 0.00125]
  small_signal_relative_rmse_gate_pct: 1.0
  jacobian_relative_error_gate: 1.0e-6
  integration_relative_rmse_gate_pct: 0.1

experiment_4b:
  duration_s: 12.0
  base_reference_amplitude_deg_s: 8.5
  severity_scales:
    near_linear: 0.5
    moderate: 1.0
    strong: 1.5
  speed_profiles_mps:
    low_to_high: [12.0, 28.0, 16.0]
    high_to_low: [28.0, 16.0, 24.0]
  near_linear_slope_loss_threshold_pct: 5.0
  steering_limit_deg: 12.0
  lateral_acceleration_limit_mps2: 8.83
  regime_gates:
    near_linear_max_utilization: 0.35
    near_linear_max_outside_fraction: 0.10
    moderate_min_utilization: 0.35
    moderate_max_utilization: 0.75
    strong_min_utilization: 0.75
    strong_max_utilization: 0.98

experiment_4c:
  fleet_seed: 1
  clients_per_family: 10
  training_speed_profiles_mps:
    profile_1: [12.0, 20.0, 15.0]
    profile_2: [20.0, 28.0, 18.0]
  test_speed_profile_mps: [28.0, 16.0, 24.0]
  training_maneuvers: [lane, sine]
  test_maneuver: unseen_s_curve
  lti_speed_anchors_mps: [12.0, 16.0, 20.0, 24.0, 28.0]
  ridge: 1.0e-10
  decision_gates:
    moderate_m3_to_m4_one_step_reduction_pct: 5.0
    moderate_m2_to_m4_one_step_reduction_pct: 5.0
    moderate_m3_to_m4_free_run_reduction_pct: 5.0

experiment_4d:
  designs: [phase3_transfer, nonlinear_data_redesign]
  test_speed_profile_mps: [28.0, 16.0, 24.0]
  test_maneuver: unseen_s_curve
  common_q_diagonal: [100.0, 10.0, 500.0]
  common_r: 10.0
  redesign_gain_grid_mps: [12.0, 16.0, 20.0, 24.0, 28.0]
  feasibility_limits:
    steering_deg: 12.0
    lateral_acceleration_mps2: 8.83
  decision_gates:
    redesign_m3_to_m4_moderate_tracking_reduction_pct: 5.0
    redesign_m2_to_m4_moderate_tracking_reduction_pct: 5.0
    redesign_m4_moderate_feasible_fraction: 1.0

experiment_4d_r:
  correction: stability_screened_physics_regularization
  candidate_physics_weights: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]
  frozen_grid_mps: [12.0, 28.0, 161]
  maximum_spectral_radius: 0.99
  selection_data: oracle_training_fleet_only
  decision_gates:
    m4_selected_weight_less_than: 1.0
    m4_moderate_feasible_fraction: 1.0
    m3_to_m4_moderate_tracking_reduction_pct: 5.0
    m2_to_m4_moderate_tracking_reduction_pct: 5.0
